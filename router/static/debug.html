<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukrainian LLM router</title>
<style>
  :root {
    --bg: #f5f4f0; --panel: #ffffff; --sunk: #f0efea; --ink: #17181a; --muted: #6a6b66; --line: #dddcd5;
    --accent: #1f5fbf; --accent-soft: #e6eefb; --pick: #f4c20d; --pick-soft: #fff6d6;
    --good: #1a7f37; --bad: #b42318; --warn: #a15c00;
    --mono: ui-monospace, "SF Mono", Menlo, monospace; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131416; --panel: #1c1e21; --sunk: #17191b; --ink: #ecece8; --muted: #9c9d96; --line: #32353a;
            --accent: #7fb1ff; --accent-soft: #1c2a40; --pick: #f4c20d; --pick-soft: #3a3210;
            --good: #4cc26a; --bad: #ff7b72; --warn: #e3a94a; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select, input, textarea { font: inherit; color: var(--ink); }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
  .brand span { color: var(--muted); font-size: 14px; }
  .ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); }
  .ghost[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  #mockwarn { color: var(--bad); border: 1px solid var(--bad); border-radius: 6px; padding: 2px 10px; font-size: 13px; }

  /* ---------- layout ---------- */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 0 24px 48px; max-width: 1080px; margin: 0 auto; }
  body.tools .layout { grid-template-columns: 320px minmax(0, 1fr); max-width: 1480px; align-items: start; }
  @media (max-width: 900px) { body.tools .layout { grid-template-columns: minmax(0, 1fr); } .layout { padding: 0 16px 32px; } header { padding: 12px 16px; } }
  aside { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
          position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; font-size: 14px; }
  body.tools aside { display: block; }
  @media (max-width: 900px) { aside { position: static; max-height: 60vh; } }
  main > * + * { margin-top: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .muted { color: var(--muted); }
  .err { color: var(--bad); }

  /* ---------- ask ---------- */
  textarea#prompt { width: 100%; min-height: 96px; resize: vertical; border: 0; background: transparent; font-size: 19px; line-height: 1.45; padding: 0; }
  textarea#prompt:focus { outline: none; }
  .examples { display: grid; gap: 8px; margin: 12px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .exrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .exlabel { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); width: 56px; flex: none; }
  .examples button { background: var(--sunk); border: 1px solid transparent; border-radius: 999px; padding: 5px 12px; font-size: 14px; color: var(--muted); }
  .examples button:hover { border-color: var(--line); color: var(--ink); }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .seg { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; border-radius: 8px; padding: 7px 14px; font-size: 15px; color: var(--muted); }
  .seg button[aria-pressed=true] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
  .bar .spacer { flex: 1; }
  .primary { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 9px 22px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .primary { color: #0e1726; } }
  button:disabled { opacity: .45; cursor: default; }
  #stop { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
  .inline { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .inline select { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  details.settings { margin-top: 12px; font-size: 14px; }
  details.settings summary, details.more summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; margin-top: 10px; }
  .grid label, aside label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .grid select, .grid input:not([type=checkbox]), aside select, aside input { width: 100%; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  aside label { margin-top: 10px; }

  /* ---------- route strip ---------- */
  .strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 640px) { .strip { grid-template-columns: minmax(0, 1fr); } }
  .spec { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--panel); transition: all .18s ease; position: relative; }
  .spec b { display: block; font-size: 17px; }
  .spec small { color: var(--muted); font-size: 13px; }
  .spec .dot { position: absolute; top: 14px; right: 14px; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
  .spec.up .dot { background: var(--good); }
  .spec.dim { opacity: .45; }
  .spec.pick { border-color: var(--pick); background: var(--pick-soft); box-shadow: 0 0 0 2px var(--pick); opacity: 1; }
  .why { margin-top: 12px; font-size: 16px; min-height: 26px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .tag { font: 13px var(--mono); padding: 2px 9px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .tag.plain { background: var(--sunk); color: var(--muted); }
  .tag.good { background: transparent; border: 1px solid var(--good); color: var(--good); }
  .tag.bad { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
  .tag.warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }

  /* ---------- answers ---------- */
  .lanes { display: grid; gap: 16px; }
  .lanes.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 900px) { .lanes.two { grid-template-columns: minmax(0, 1fr); } }
  .lane h3 { margin: 0 0 4px; font-size: 17px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lane .sub { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .answer { font-size: 17px; line-height: 1.6; overflow-wrap: anywhere; min-height: 28px; }
  .answer p { margin: 0 0 .7em; } .answer p:last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 0 0 .7em; padding-left: 1.3em; }
  .answer pre { background: var(--sunk); border-radius: 8px; padding: 12px; overflow-x: auto; font: 14px/1.5 var(--mono); margin: 0 0 .7em; }
  .answer code { font: .9em var(--mono); background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
  .answer pre code { background: transparent; padding: 0; }
  .answer.streaming { white-space: pre-wrap; }
  .answer.streaming::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .stats { display: flex; gap: 8px 18px; flex-wrap: wrap; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  details.more { margin-top: 10px; }
  pre.raw { margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; font: 13px/1.45 var(--mono); background: var(--sunk); padding: 10px; border-radius: 8px; max-height: 360px; overflow: auto; }
  .rule { font: 13px var(--mono); display: flex; gap: 8px; color: var(--muted); padding: 1px 0; }
  .rule.fired { color: var(--accent); font-weight: 600; }

  /* ---------- multi-step ---------- */
  .gate { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 17px; }
  .gate .big { font-weight: 600; }
  .steps { margin-top: 16px; display: grid; gap: 0; }
  .step { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }
  .step .rail { display: flex; flex-direction: column; align-items: center; }
  .step .num { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 600; font-size: 14px; background: var(--panel); flex: none; }
  .step .rail::after { content: ""; flex: 1; width: 2px; background: var(--line); margin: 4px 0; }
  .step:last-child .rail::after { display: none; }
  .step.running .num { border-color: var(--accent); color: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .step.done .num { border-color: var(--good); color: var(--good); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px var(--accent-soft); } }
  .step .body { padding-bottom: 18px; min-width: 0; }
  .step .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
  .step .task { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .step .outp { margin-top: 8px; background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 15px; overflow-wrap: anywhere; max-height: 220px; overflow: auto; }
  .step .outp p { margin: 0 0 .5em; } .step .outp p:last-child { margin-bottom: 0; } .step .outp ul, .step .outp ol { margin: 0 0 .5em; padding-left: 1.3em; }
  .step .outp pre { background: var(--panel); border-radius: 6px; padding: 8px; overflow-x: auto; font: 13px/1.45 var(--mono); margin: 0 0 .5em; }
  .final { border-color: var(--good); }

  /* ---------- tools ---------- */
  .list { margin-top: 10px; }
  .list button { display: block; width: 100%; text-align: left; margin: 0 0 4px; padding: 7px 9px; background: var(--sunk); border: 1px solid transparent; border-radius: 8px; font-size: 13px; overflow-wrap: anywhere; }
  .list button[aria-current=true] { border-color: var(--accent); }
  .list small { display: block; color: var(--muted); }
  .pager { display: flex; gap: 6px; margin-top: 8px; } .pager button { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; }
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 14px; margin: 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .kv pre { margin: 0; white-space: pre-wrap; font: 13px/1.45 var(--mono); }
  .gold { border-left: 3px solid var(--good); padding-left: 10px; }
  #itemcard .rowb { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  #itemcard .rowb button { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Ukrainian LLM router</h1><span>three small specialists, one entry point</span></div>
  <span id="mockwarn" hidden>MOCK BACKENDS: answers are fake</span>
  <button class="ghost" id="toolsbtn" aria-pressed="false">Benchmark tools</button>
</header>

<div class="layout">
  <aside>
    <h2>Benchmark browser</h2>
    <label style="margin-top:0">Suite</label><select id="suite"></select>
    <label>Bucket / family</label><select id="bucket"><option value="">all</option></select>
    <label>Search</label><input id="q" placeholder="text or id">
    <label>Only items a system got wrong</label>
    <select id="detail"><option value="">off</option></select>
    <select id="system" style="margin-top:4px" disabled><option value="">system</option></select>
    <label>Score below</label><input id="maxscore" type="number" step="0.05" value="1">
    <div class="muted" id="count" style="margin-top:10px"></div>
    <div class="list" id="list"></div>
    <div class="pager"><button id="prev" aria-label="Previous page">‹</button><button id="next" aria-label="Next page">›</button></div>
    <details class="more" id="logbox"><summary>Session log (logs/debug_sessions/)</summary><div id="log"></div></details>
  </aside>

  <main>
    <section class="card" id="itemcard" hidden></section>

    <section class="card">
      <textarea id="prompt" placeholder="Напишіть запит українською або виберіть приклад нижче" aria-label="Request"></textarea>
      <div class="examples" id="examples"></div>
      <div class="bar">
        <div class="seg" id="mode" role="group" aria-label="Mode">
          <button data-m="router" aria-pressed="true">Router</button>
          <button data-m="compare" aria-pressed="false">Router vs one model</button>
          <button data-m="composite" aria-pressed="false">Multi-step</button>
          <button data-m="model" aria-pressed="false">One model</button>
        </div>
        <span class="inline" id="modelbox" hidden><span id="modellabel">Model</span><select id="model" aria-label="Model"></select></span>
        <span class="spacer"></span>
        <button id="stop" disabled>Stop</button>
        <button class="primary" id="run">Run</button>
      </div>
      <details class="settings">
        <summary>Settings</summary>
        <div class="grid">
          <div id="profilebox"><label for="profile">Router table</label><select id="profile"></select></div>
          <div id="alignbox"><label for="align">Alignment prompt</label>
            <select id="align"><option value="fewshot">fewshot</option><option value="baseline">baseline</option></select></div>
          <div id="plannerbox"><label for="planner">Planner</label><select id="planner"></select></div>
          <div id="oraclebox"><label for="oracle">Benchmark item plan</label>
            <label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink)"><input type="checkbox" id="oracle"> use the gold (oracle) plan</label></div>
          <div><label for="temp">Temperature</label><input id="temp" type="number" step="0.1" value="0"></div>
          <div><label for="maxtok">max_tokens</label><input id="maxtok" type="number" value="1024"></div>
          <div><label for="seed">seed</label><input id="seed" type="number" value="42"></div>
        </div>
      </details>
    </section>

    <section class="card" id="routecard">
      <h2 id="routetitle">Where this request goes</h2>
      <div class="strip" id="strip"></div>
      <div class="why" id="why"><span class="muted">Start typing: the route is decided by rules before any model is called.</span></div>
    </section>

    <section id="lanes" class="lanes"></section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el[k] = v; else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const NAMES = { mamay4: "Mamay-4B", lapa: "Lapa-12B", aya: "Aya-8B", mamay12: "Mamay-12B", mamay27: "Mamay-27B", qwen: "Qwen-Coder-3B", qwen7: "Qwen-Coder-7B" };
const nice = (a) => NAMES[a] || a;
/* replaceChildren would print a literal "null" for a missing optional child */
const put = (el, ...kids) => el.replaceChildren(...kids.flat().filter((k) => k != null && k !== false));
const POOL = [
  { alias: "aya", role: "translation · conversation" },
  { alias: "lapa", role: "knowledge · ethics" },
  { alias: "mamay4", role: "instructions · code · planning" },
];
const INTENT_MODEL = { translate: "aya", chat: "aya", knowledge: "lapa", alignment: "lapa", instruct: "mamay4", code: "mamay4" };
const EXAMPLES = [
  { label: "Translation", text: "Переклади англійською: Я запізнюсь на 10 хвилин." },
  { label: "Knowledge", text: "Що таке фотосинтез? Поясни коротко." },
  { label: "Format rules", text: "Напиши привітання колезі з днем народження, рівно три речення." },
  { label: "Ethics", text: "Оціни, чи є описана дія морально неприйнятною. Відповідай лише цифрою: 0 — прийнятна, 1 — неприйнятна.\n\nЯ взяв чужу парасольку без дозволу, бо йшов дощ." },
  { label: "Code", text: "Напиши SQL-запит, що вибирає користувачів, старших за 30." },
  { label: "Conversation", text: "Що подарувати татові на 60-річчя? Він любить риболовлю." },
  { label: "Word problem", mode: "composite", text: "У гаражі є 1 дриль, 6 молотків, 3 подовжувачі, 1 повітродувка для листя і 7 викруток. Усі електричні прилади треба скласти у водонепроникну шафу. Скільки предметів піде у шафу?" },
  { label: "Two tasks in one", mode: "composite", text: "Переклади українською \"The early bird catches the worm\" і поясни значення вислову." },  /* Hard: answers read and judged correct on 13 Oct 2026, in the mode set here (repeat runs gave identical text). */
  { group: "hard", label: "Facts → table", mode: "composite", text: "Назви три найбільші за населенням міста України і подай відповідь таблицею Markdown зі стовпцями «Місто» і «Область»." },
  { group: "hard", label: "Extract → classify → JSON", mode: "composite", text: "Опрацюй оголошення: спочатку визнач тему й терміновість, а потім поверни лише JSON з ключами \"topic\" (utilities, culture або education) і \"urgency\" (low, medium або high).\n\nОголошення: Увага! Через прорив труби на вулиці Шевченка сьогодні з 10:00 до 18:00 не буде холодної води. Аварійна бригада вже працює." },
  { group: "limits", label: "Who is second youngest", mode: "composite", text: "Оля старша за Іру, Іра старша за Марка, а Марко старший за Данила. Хто з них другий наймолодший? Відповідай іменем і одним реченням пояснення." },
  { group: "hard", label: "English spec → code", mode: "router", text: "Ось опис англійською: \"Write a function that returns the n-th Fibonacci number without recursion.\" Переклади опис українською, а потім напиши цю функцію на Python." },
  { group: "hard", label: "News → one-line JSON", mode: "router", text: "Ось новина англійською: \"The city council approved a new tram line that will connect the railway station with the university by 2027. Construction starts next spring and will cost 40 million euros.\" Переклади її українською, стисни до одного речення і поверни лише JSON з ключами \"topic\" і \"summary\"." },
  { group: "hard", label: "Read → answer → 3-line poem", mode: "router", text: "Прочитай текст: \"Penicillin was discovered in 1928 by Alexander Fleming, who noticed that mould killed bacteria in a dish he had left by the window.\" Скажи українською, хто і коли зробив це відкриття, а потім напиши про це вірш рівно з трьох рядків." },
  { group: "hard", label: "SQL + explanation", mode: "router", text: "Є таблиця orders(id, customer, amount, created_at). Напиши SQL-запит, що повертає трьох клієнтів із найбільшою загальною сумою замовлень за 2025 рік, і поясни українською двома реченнями, як він працює." },
  { group: "hard", label: "Prices in English → sum", mode: "router", text: "Ось ціни англійською: apples $3 each, bread $2 per loaf, milk $1.5 per bottle. Переклади цей список українською і порахуй, скільки коштують 2 яблука, 1 хліб і 3 пляшки молока разом." },
  { group: "hard", label: "Only the fruit", mode: "composite", text: "Я купую продукти для фруктового салату: 3 яблука по 12 грн, 2 банани по 8 грн, пачку солі за 15 грн і 1 лимон за 10 грн. Скільки гривень я заплачу лише за фрукти?" },
  { group: "hard", label: "Sick pupils", mode: "composite", text: "У класі 12 парт, за кожною сидять по 2 учні. Троє учнів сьогодні хворіють і залишились удома. Учителька роздає по 2 зошити кожному присутньому учневі. Скільки зошитів вона роздасть?" },
  { group: "hard", label: "Three shelves of books", mode: "composite", text: "У Олі 10 книжок. У Петра на 5 книжок більше, ніж у Олі. У Марії вдвічі більше книжок, ніж у Петра. Скільки книжок у всіх трьох разом?" },
  { group: "hard", label: "Train arrival", mode: "router", text: "Поїзд виїхав о 14:35 і їде зі швидкістю 90 км/год. О котрій годині він проїде 60 км?" },
  { group: "hard", label: "Years between two events", mode: "router", text: "Скільки років минуло від Хрещення Русі до проголошення незалежності України? Назви обидва роки і різницю." },
  /* Limits: the specialists get these wrong (weekday arithmetic, a commonsense filter, a receipt, an ordering puzzle). */

/* ---------- tiny safe markdown: text is escaped by the DOM, only structure is added ---------- */

}

async function run() {
  const prompt = $("prompt").value.trim(); if (!prompt) return;
  const attached = state.item && prompt === state.itemPrompt;
  const body = { prompt, mode: state.mode === "model" ? "model" : "router", model: $("model").value, model_b: $("model").value,
    profile: $("profile").value, align_prompt: $("align").value, planner_profile: $("planner").value, use_oracle: $("oracle").checked,
    temperature: parseFloat($("temp").value || 0), max_tokens: parseInt($("maxtok").value || 1024), seed: $("seed").value === "" ? null : parseInt($("seed").value) };
  if (attached) { body.suite = state.item.suite; body.item_id = state.item.id; }
  const lanes = $("lanes"); lanes.replaceChildren(); lanes.className = "lanes";
  const path = { router: "chat", model: "chat", compare: "compare", composite: "composite" }[state.mode];
  const by = {};

    lanes.className = "lanes two";
    by.a = newLane("Router"); by.b = newLane(nice(body.model_b), "one model answers everything");
    lanes.append(by.a.root, by.b.root);
  } else if (state.mode === "composite") by.c = newComposite(lanes);
  else { by.a = newLane(state.mode === "router" ? "Answer" : nice(body.model), state.mode === "router" ? "" : "one model, no routing"); lanes.append(by.a.root); }
  if (!attached && state.item) lanes.prepend(h("div", { class: "muted" }, "The prompt was edited, so this run is not scored against the loaded item."));

  try {
    const resp = await fetch("/debug/api/" + path, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body), signal: state.abort.signal });
    if (!resp.ok) throw new Error(resp.status + " " + (await resp.text()).slice(0, 300));
    const reader = resp.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!chunk.startsWith("data:")) continue;
        const ev = JSON.parse(chunk.slice(5));
        if (state.mode === "composite") handleComposite(by.c, ev);
        else { const side = ev.side || "a"; handleLane(by[side], ev, side === "a" && state.mode !== "model"); }
      }

  } catch (e) {

  } finally {
    Object.values(by).forEach((l) => l.out && l.out.classList.remove("streaming"));
    $("run").disabled = false; $("stop").disabled = true;
    if (document.body.classList.contains("tools")) loadLog();
  }
}

const GROUPS = [["", "Basics"], ["hard", "Hard"], ["limits", "Limits"]];
$("examples").replaceChildren(...GROUPS.map(([key, title]) => h("div", { class: "exrow" }, h("span", { class: "exlabel" }, title),
  ...EXAMPLES.filter((ex) => (ex.group || "") === key).map((ex) => h("button", { onclick: () => {
    $("prompt").value = ex.text; state.item = null; state.shown = null; $("itemcard").hidden = true; $("lanes").replaceChildren();
    setMode(ex.mode || (state.mode === "composite" ? "router" : state.mode)); preview(); $("prompt").focus();
  } }, ex.label)))));
$("mode").onclick = (e) => e.target.dataset.m && setMode(e.target.dataset.m);
$("prompt").addEventListener("input", () => {
  state.shown = null;
  const box = $("itemcard"), detached = state.item && $("prompt").value !== state.itemPrompt;
  box.style.opacity = detached ? 0.45 : 1;
  const old = box.querySelector(".detached"); if (old) old.remove();
  if (detached) box.prepend(h("div", { class: "tag warn detached", style: "margin-bottom:8px;display:inline-block;white-space:normal" },
    "prompt edited: this is no longer the benchmark item, gold and scoring do not apply"));
  if (state.mode !== "composite") preview();
});
$("profile").onchange = preview;
$("run").onclick = run; $("stop").onclick = () => state.abort && state.abort.abort();
$("prompt").addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run(); });
["suite", "bucket", "maxscore"].forEach((id) => $(id).onchange = () => { state.offset = 0; if (id === "suite") $("bucket").replaceChildren(h("option", { value: "" }, "all")); loadList(); });
$("q").oninput = () => { state.offset = 0; clearTimeout(state.t); state.t = setTimeout(loadList, 250); };
$("detail").onchange = () => { const s = state.files[$("detail").value] || []; fill($("system"), s); $("system").disabled = !s.length; state.offset = 0; loadList(); };
$("system").onchange = () => { state.offset = 0; loadList(); };
$("prev").onclick = () => { state.offset = Math.max(0, state.offset - LIMIT); loadList(); };
$("next").onclick = () => { state.offset += LIMIT; loadList(); };

(async () => {
  await loadHealth().catch((e) => $("why").replaceChildren(h("span", { class: "err" }, String(e))));
  setMode("router");
  let tools = false; try { tools = localStorage.getItem("router-debug-tools") === "1"; } catch (e) { /* storage is optional */ }
  setTools(tools);
})();
</script>
</body>
</html>
